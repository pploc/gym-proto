name: Validate and Publish Stubs

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
    tags: ["v3.0.0"]

permissions:
  contents: read

env:
  STABLE_PROTO_TAG: v2.0.0
  RELEASE_TARGET: v3.0.0
  SCHEMA_REGISTRY_URL: http://localhost:8081

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      kafka:
        image: confluentinc/cp-kafka:7.7.1
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
          KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      schema-registry:
        image: confluentinc/cp-schema-registry:7.7.1
        ports:
          - 8081:8081
        env:
          SCHEMA_REGISTRY_HOST_NAME: schema-registry
          SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
          SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go for grpc-gateway generation
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify release target
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.versions.gymProto.releaseTarget' contracts/v1/manifest.json)" = "$RELEASE_TARGET"
          test "$(jq -r '.versions.protoGo.releaseTarget' contracts/v1/manifest.json)" = "$RELEASE_TARGET"
          test "v$(jq -r '.versions.gymProtoJava.releaseTarget' contracts/v1/manifest.json)" = "$RELEASE_TARGET"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "${GITHUB_REF#refs/tags/}" = "$RELEASE_TARGET"
          fi

      - name: Verify Protobuf format, lint, and declared major break
        shell: bash
        run: |
          set -euo pipefail
          buf format -d --exit-code proto
          buf lint proto
          if buf breaking . --against ".git#tag=${STABLE_PROTO_TAG}" > /tmp/breaking.txt 2>&1; then
            echo "v3.0.0 must contain the declared Member-to-Plans source break" >&2
            exit 1
          fi
          grep -Fq 'go_package' /tmp/breaking.txt
          grep -Fq 'GetPlans' /tmp/breaking.txt
          grep -Fq 'CreateGymLocation' /tmp/breaking.txt
          grep -Fq 'GetGymLocation' /tmp/breaking.txt
          if grep -Eq 'PaymentCompletedEvent|field number 1 named payment_id' /tmp/breaking.txt; then
            echo "payment completion event unexpectedly broke wire compatibility" >&2
            cat /tmp/breaking.txt >&2
            exit 1
          fi

      - name: Generate stubs and verify routes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
          ./scripts/verify-http-config.py
          rm -rf gen
          buf generate
          ./scripts/verify-generated-routes.sh

      - name: Verify generated output is deterministic
        shell: bash
        run: |
          set -euo pipefail
          find gen -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/generated-before.sha256
          rm -rf gen
          buf generate
          find gen -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/generated-after.sha256
          diff -u /tmp/generated-before.sha256 /tmp/generated-after.sha256

      - name: Wait for Schema Registry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            curl --fail --silent "$SCHEMA_REGISTRY_URL/subjects" >/dev/null && exit 0
            sleep 2
          done
          echo "Schema Registry did not become ready" >&2
          exit 1

      - name: Generate and verify Confluent fixtures
        shell: bash
        run: |
          set -euo pipefail
          cp contracts/v1/kafka/confluent-7.7.1-fixtures.json /tmp/committed-fixtures.json
          ./gradlew generateConfluentFixtures \
            -PschemaRegistryUrl="$SCHEMA_REGISTRY_URL" --no-daemon
          python3 - <<'PY'
          import json
          from pathlib import Path

          committed = json.loads(Path('/tmp/committed-fixtures.json').read_text())
          generated = json.loads(Path('contracts/v1/kafka/confluent-7.7.1-fixtures.json').read_text())
          committed['generatedBy']['schemaRegistryUrl'] = '<registry-url>'
          generated['generatedBy']['schemaRegistryUrl'] = '<registry-url>'
          if committed != generated:
              raise SystemExit('generated Confluent fixtures differ from the committed artifact')
          PY
          ./gradlew check \
            -PschemaRegistryUrl="$SCHEMA_REGISTRY_URL" --no-daemon
          ./gradlew verifyConfluentBackwardCompatibility \
            -PschemaRegistryUrl="$SCHEMA_REGISTRY_URL" --no-daemon
          expected_subjects="$(jq -r '[.cases[].subject] | unique | length' contracts/v1/kafka/confluent-7.7.1-fixtures.json)"
          test "$(curl --fail --silent "$SCHEMA_REGISTRY_URL/subjects" | jq length)" -eq "$expected_subjects"
          for subject in $(jq -r '.cases[].subject' contracts/v1/kafka/confluent-7.7.1-fixtures.json); do
            test "$(curl --fail --silent "$SCHEMA_REGISTRY_URL/config/$subject" | jq -r '.compatibilityLevel')" = BACKWARD
          done

      - name: Create verification checksums and report
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          sha256sum contracts/v1/kafka/confluent-7.7.1-fixtures.json > evidence/fixture.sha256
          if [[ -d gen ]]; then
            find gen -type f -print0 | sort -z | xargs -0 sha256sum > evidence/generated.sha256
          fi
          jq '{sourceSha: env.GITHUB_SHA, sourceRef: env.GITHUB_REF, stableProtoTag: env.STABLE_PROTO_TAG, releaseTarget: env.RELEASE_TARGET}' \
            > evidence/validation-report.json

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gym-proto-validation-${{ github.sha }}
          path: evidence/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          test -n "$VERSION"
          test "v${VERSION}" = "$RELEASE_TARGET"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Refuse conflicting release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GO_PUBLISH_TOKEN: ${{ secrets.GO_PUBLISH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GO_PUBLISH_TOKEN"
          if git ls-remote --exit-code --tags \
            "https://x-access-token:${GO_PUBLISH_TOKEN}@github.com/pploc/proto-go.git" \
            "refs/tags/v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "proto-go v${RELEASE_VERSION} already exists" >&2
            exit 1
          fi
          if gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "gym-proto release v${RELEASE_VERSION} already exists" >&2
            exit 1
          fi

      - name: Generate release artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf gen evidence
          buf generate
          ./scripts/verify-generated-routes.sh
          ./gradlew check --no-daemon
          mkdir -p evidence
          sha256sum contracts/v1/kafka/confluent-7.7.1-fixtures.json > evidence/fixture.sha256
          find gen -type f -print0 | sort -z | xargs -0 sha256sum > evidence/generated.sha256
          jq -n --arg version "$RELEASE_VERSION" \
            '{sourceSha: env.GITHUB_SHA, sourceRef: env.GITHUB_REF, releaseVersion: $version}' \
            > evidence/release-report.json

      - name: Prepare immutable Go release commit
        env:
          GO_PUBLISH_TOKEN: ${{ secrets.GO_PUBLISH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          target="https://x-access-token:${GO_PUBLISH_TOKEN}@github.com/pploc/proto-go.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone --branch main "$target" proto-go-repo
          cd proto-go-repo
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git ! -name README.md ! -name go.mod -exec rm -rf {} +
          cp -R ../gen/go/. .
          cp -R ../contracts .
          cp -R ../evidence .
          # Go semantic import versioning: major >= 2 requires /vN module path.
          major="${RELEASE_VERSION%%.*}"
          module_path="github.com/pploc/proto-go"
          if [[ "$major" =~ ^[0-9]+$ ]] && (( major >= 2 )); then
            module_path="github.com/pploc/proto-go/v${major}"
            if ! grep -R --include='*.go' -Fq "${module_path}/" .; then
              echo "refusing major version ${RELEASE_VERSION}: generated Go stubs do not import ${module_path}" >&2
              exit 1
            fi
            if grep -R --include='*.go' -E 'github.com/pploc/proto-go/[^v]' . >/dev/null 2>&1; then
              echo "refusing major version ${RELEASE_VERSION}: generated Go stubs still import non-/v${major} paths" >&2
              exit 1
            fi
          fi
          {
            printf 'module %s\n\ngo 1.26\n' "${module_path}"
          } > go.mod
          go mod tidy
          go test ./...
          git add --all
          if git diff --cached --quiet; then
            echo "generated proto-go output is unchanged; refusing an empty release" >&2
            exit 1
          fi
          git commit -m "chore: publish Go stubs v${RELEASE_VERSION}"
          git tag -a "v${RELEASE_VERSION}" -m "proto-go v${RELEASE_VERSION}"
          git bundle create ../proto-go-release.bundle "v${RELEASE_VERSION}"
          git rev-parse "v${RELEASE_VERSION}^{commit}" > ../evidence/proto-go-commit.txt
          cd ..
          sha256sum proto-go-release.bundle >> evidence/release-assets.sha256

      - name: Publish Java stubs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: ./gradlew publish --no-daemon

      - name: Publish Go tag before updating main
        env:
          GO_PUBLISH_TOKEN: ${{ secrets.GO_PUBLISH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd proto-go-repo
          target="https://x-access-token:${GO_PUBLISH_TOKEN}@github.com/pploc/proto-go.git"
          git push "$target" "refs/tags/v${RELEASE_VERSION}"
          git push "$target" "v${RELEASE_VERSION}^{commit}:refs/heads/main"

      - name: Publish release evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v${RELEASE_VERSION}" \
            evidence/* proto-go-release.bundle \
            --verify-tag \
            --title "gym-proto v${RELEASE_VERSION}" \
            --notes "Source SHA: ${GITHUB_SHA}"

      - name: Upload recoverable release evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gym-proto-release-${{ github.sha }}
          path: |
            evidence/
            proto-go-release.bundle
          if-no-files-found: error
          retention-days: 90

  recover-v1-1-0-release-evidence:
    if: >-
      github.ref == 'refs/heads/develop' &&
      github.event.head_commit.message == 'fix: recover v1.1.0 release evidence'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v1.1.0

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: false

      - name: Rebuild release evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf gen evidence proto-go-repo
          buf generate
          ./scripts/verify-generated-routes.sh
          mkdir -p evidence
          SOURCE_SHA="$(git rev-parse HEAD)"
          sha256sum contracts/v1/kafka/confluent-7.7.1-fixtures.json > evidence/fixture.sha256
          find gen -type f -print0 | sort -z | xargs -0 sha256sum > evidence/generated.sha256
          git clone https://github.com/pploc/proto-go.git proto-go-repo
          git -C proto-go-repo bundle create ../proto-go-release.bundle refs/tags/v1.1.0
          PROTO_GO_SHA="$(git -C proto-go-repo rev-parse 'v1.1.0^{commit}')"
          jq -n \
            --arg sourceSha "$SOURCE_SHA" \
            --arg protoGoSha "$PROTO_GO_SHA" \
            '{sourceSha: $sourceSha, sourceRef: "refs/tags/v1.1.0", releaseVersion: "1.1.0", protoGoCommit: $protoGoSha, recovery: true}' \
            > evidence/release-report.json
          sha256sum proto-go-release.bundle > evidence/release-assets.sha256

      - name: Publish recovered release evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.1.0 \
            evidence/* proto-go-release.bundle \
            --verify-tag \
            --title "gym-proto v1.1.0" \
            --notes "Source SHA: 740e476915117ab594a6e7ee3677e6a2c39c3c80. Java and Go artifacts were published by the original tag workflow; this job recovered the release evidence after its final step failed."

  reconcile-v1-1-0-deployment:
    if: >-
      github.ref == 'refs/heads/develop' &&
      github.event.head_commit.message == 'fix: reconcile v1.1.0 release deployment'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    steps:
      - name: Reconcile verified release deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/deployments/5721148368/statuses" \
            -f state=success \
            -f environment=release \
            -f description='v1.1.0 artifacts and recovered release evidence verified' \
            -f log_url='https://github.com/pploc/gym-proto/actions/runs/30786709517' \
            -f environment_url='https://github.com/pploc/gym-proto/releases/tag/v1.1.0' \
            -F auto_inactive=false
