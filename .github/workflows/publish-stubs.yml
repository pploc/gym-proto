name: Publish Stubs

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout gym-proto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Release Version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags

          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            LATEST_TAG=$(git tag -l "v*" | sort -V | tail -n 1)
            if [[ -z "$LATEST_TAG" ]]; then
              LATEST_TAG="v1.0.0"
            fi
            BASE_VER=${LATEST_TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VER"
            NEW_PATCH=$((PATCH + 1))
            VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
            NEW_TAG="v${VERSION}"
            echo "Auto-incrementing version from $LATEST_TAG to $NEW_TAG"
            git tag "$NEW_TAG"
            git push origin "$NEW_TAG" || true
          fi
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Release version set to $VERSION"

      - name: Generate Stubs
        run: buf generate

      # --- Publish Java Stubs to GitHub Packages ---
      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '26'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish Java Package
        run: gradle publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}

      # --- Publish Go Stubs to proto-go repo ---
      - name: Publish Go Stubs
        env:
          PROTO_GO_REPO: "github.com/pploc/proto-go"
          GO_PUBLISH_TOKEN: ${{ secrets.GO_PUBLISH_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Clone target Go repository
          git clone https://x-access-token:${GO_PUBLISH_TOKEN}@${PROTO_GO_REPO}.git proto-go-repo

          # Clean old generated files while preserving module metadata.
          find proto-go-repo -mindepth 1 -maxdepth 1 -not -name ".git" -not -name "README.md" -not -name "go.mod" -exec rm -rf {} +

          # The published target is a standalone, permanently importable Go module.
          cat > proto-go-repo/go.mod <<'EOF'
          module github.com/pploc/proto-go

          go 1.22
          EOF

          # Copy generated packages whose go_package options target proto-go.
          cp -r gen/go/* proto-go-repo/

          cd proto-go-repo
          go mod tidy

          # Commit and tag the exact generated-stub release.
          git add .
          if git diff-index --quiet HEAD --; then
            echo "No changes in Go stubs"
          else
            git commit -m "chore: update Go stubs to ${{ env.RELEASE_VERSION }}"
            git push origin develop

            TAG_NAME="v${{ env.RELEASE_VERSION }}"
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"
          fi
