name: Validate and Publish Stubs

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate stubs
        run: buf generate

      - name: Verify generated Java stubs compile
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"

      - name: Build Java stubs
        uses: gradle/actions/setup-gradle@v4

      - run: gradle build

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set release version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          test -n "$VERSION"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate stubs
        run: buf generate

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish Java stubs
        run: gradle publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Publish Go stubs
        env:
          GO_PUBLISH_TOKEN: ${{ secrets.GO_PUBLISH_TOKEN }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          test -n "$GO_PUBLISH_TOKEN"
          target="https://x-access-token:${GO_PUBLISH_TOKEN}@github.com/pploc/proto-go.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone --branch main "$target" proto-go-repo
          cd proto-go-repo

          if git rev-parse -q --verify "refs/tags/v${RELEASE_VERSION}" >/dev/null; then
            echo "proto-go v${RELEASE_VERSION} already exists" >&2
            exit 1
          fi

          find . -mindepth 1 -maxdepth 1 \
            ! -name .git ! -name README.md ! -name go.mod -exec rm -rf {} +
          cp -R ../gen/go/. .
          mkdir -p contracts/v1
          cp -R ../contracts/v1/kafka contracts/v1/kafka
          cat > go.mod <<'EOF'
          module github.com/pploc/proto-go

          go 1.26
          EOF
          go mod tidy
          go test ./...

          git add --all
          if git diff --cached --quiet; then
            echo "generated proto-go output is unchanged; refusing an empty release" >&2
            exit 1
          fi
          git commit -m "chore: publish Go stubs v${RELEASE_VERSION}"
          git push origin HEAD:main
          git tag "v${RELEASE_VERSION}"
          git push origin "v${RELEASE_VERSION}"
