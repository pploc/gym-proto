syntax = "proto3";

package payment.v1;

import "buf/validate/validate.proto";
import "common/v1/common.proto";

option go_package = "github.com/pploc/proto-go/payment/v1;paymentv1";
option java_multiple_files = true;
option java_package = "com.gym.proto.payment.v1";

enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_PENDING = 1;
  PAYMENT_STATUS_COMPLETED = 2;
  PAYMENT_STATUS_FAILED = 3;
  PAYMENT_STATUS_REFUNDED = 4;
}

service PaymentService {
  rpc InitiatePayment(InitiatePaymentRequest) returns (InitiatePaymentResponse);
  rpc GetPaymentStatus(GetPaymentStatusRequest) returns (GetPaymentStatusResponse);
  rpc GetSpendingHistory(GetSpendingHistoryRequest) returns (GetSpendingHistoryResponse);

  rpc RefundPayment(RefundPaymentRequest) returns (RefundPaymentResponse);
  rpc GetRevenueReport(GetRevenueReportRequest) returns (GetRevenueReportResponse);

  rpc GetPaymentsByUser(GetPaymentsByUserRequest) returns (GetPaymentsByUserResponse);
}

message InitiatePaymentRequest {
  string gym_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  common.v1.PaymentType payment_type = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string reference_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  // Open provider vocabulary (MOMO, ZALOPAY, VNPAY, STRIPE, ...).
  string provider = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string discount_code = 5 [(buf.validate.field).string = {max_len: 64}];
  string user_id = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  int64 amount_vnd = 7 [(buf.validate.field).int64 = {
    gte: 0
    lte: 100000000000
  }];
}

message InitiatePaymentResponse {
  string payment_id = 1;
  string payment_url = 2;
}

message GetPaymentStatusRequest {
  string payment_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message GetPaymentStatusResponse {
  string payment_id = 1;
  PaymentStatus status = 2;
  int64 amount_vnd = 3;
}

message GetSpendingHistoryRequest {
  string user_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  common.v1.PaginationRequest pagination = 2;
}

message Transaction {
  string id = 1;
  common.v1.PaymentType type = 2;
  int64 amount_vnd = 3;
  PaymentStatus status = 4;
  string provider = 5;
  string created_at = 6;
  string description = 7;
}

message GetSpendingHistoryResponse {
  repeated Transaction transactions = 1;
  common.v1.PaginationResponse pagination = 2;
}

message RefundPaymentRequest {
  string payment_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string reason = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }];
  int32 refund_percentage = 3 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
}

message RefundPaymentResponse {
  string refund_id = 1;
  PaymentStatus status = 2;
}

message GetRevenueReportRequest {
  string gym_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string start_date = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"
  }];
  string end_date = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"
  }];
  option (buf.validate.message).cel = {
    id: "revenue_date_order"
    message: "end_date must be on or after start_date"
    expression: "this.start_date <= this.end_date"
  };
}

message GetRevenueReportResponse {
  int64 total_revenue_vnd = 1;
  int64 membership_revenue_vnd = 2;
  int64 trainer_revenue_vnd = 3;
}

message GetPaymentsByUserRequest {
  string user_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message GetPaymentsByUserResponse {
  repeated Transaction payments = 1;
}
