syntax = "proto3";

package events.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/pploc/proto-go/events/v1;eventsv1";
option java_multiple_files = true;
option java_package = "com.gym.proto.events.v1";

message WorkoutLoggedEvent {
  string user_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string workout_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string gym_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  int32 exercise_count = 4 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  int32 duration_minutes = 5 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1440
  }];
  int64 logged_at = 6 [(buf.validate.field).int64 = {gt: 0}];
}
