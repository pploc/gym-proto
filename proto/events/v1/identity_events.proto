syntax = "proto3";

package events.v1;

import "buf/validate/validate.proto";
import "common/v1/common.proto";

option go_package = "github.com/pploc/proto-go/events/v1;eventsv1";
option java_multiple_files = true;
option java_package = "com.gym.proto.events.v1";

message UserRegisteredEvent {
  string user_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string email = 2 [(buf.validate.field).string = {
    email: true
    max_len: 320
  }];
  string full_name = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  common.v1.Role role = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  reserved 5;
  reserved "gym_id";
  common.v1.AuthProvider auth_provider = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  int64 timestamp = 7 [(buf.validate.field).int64 = {gt: 0}];
}

message UserSuspendedEvent {
  string user_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  common.v1.Role role = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  reserved 3;
  reserved "gym_id";
  int64 timestamp = 4 [(buf.validate.field).int64 = {gt: 0}];
}

message UserRoleChangedEvent {
  string user_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  common.v1.Role old_role = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  common.v1.Role new_role = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  reserved 4;
  reserved "gym_id";
  int64 timestamp = 5 [(buf.validate.field).int64 = {gt: 0}];
  option (buf.validate.message).cel = {
    id: "role_changed_diff"
    message: "new_role must differ from old_role"
    expression: "this.old_role != this.new_role"
  };
}

// Topic: identity.email.verification-requested.v1
// Key: user_id
// Emitted on local Register and ResendEmailVerification when a new token is minted.
// verification_url is secret material (frontend deep link with raw token). Restrict
// topic ACLs; Notification must not log this field.
message EmailVerificationRequestedEvent {
  string user_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string email = 2 [(buf.validate.field).string = {
    email: true
    max_len: 320
  }];
  string full_name = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  string verification_url = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
    uri: true
  }];
  int64 expires_at = 5 [(buf.validate.field).int64 = {gt: 0}]; // unix epoch seconds
  int64 timestamp = 6 [(buf.validate.field).int64 = {gt: 0}]; // unix epoch seconds
}
