syntax = "proto3";

package events.v1;

option go_package = "github.com/pploc/proto-go/v3/events/v1;eventsv1";
option java_multiple_files = true;
option java_package = "com.gym.proto.events.v1";

message UserRegisteredEvent {
  string user_id = 1;
  string email = 2;
  string full_name = 3;
  string role = 4;
  reserved 5;
  reserved "gym_id";
  string auth_provider = 6;
  int64 timestamp = 7;
}

message UserSuspendedEvent {
  string user_id = 1;
  string role = 2;
  reserved 3;
  reserved "gym_id";
  int64 timestamp = 4;
}

message UserRoleChangedEvent {
  string user_id = 1;
  string old_role = 2;
  string new_role = 3;
  reserved 4;
  reserved "gym_id";
  int64 timestamp = 5;
}

// Topic: identity.email.verification-requested.v1
// Key: user_id
// Emitted on local Register and ResendEmailVerification when a new token is minted.
// verification_url is secret material (frontend deep link with raw token). Restrict
// topic ACLs; Notification must not log this field.
message EmailVerificationRequestedEvent {
  string user_id = 1;
  string email = 2;
  string full_name = 3;
  string verification_url = 4;
  int64 expires_at = 5; // unix epoch seconds
  int64 timestamp = 6; // unix epoch seconds
}
