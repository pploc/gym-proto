syntax = "proto3";

package trainer.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "openapiv3/annotations.proto";

option go_package = "github.com/pploc/proto-go/trainer/v1;trainerv1";
option java_multiple_files = true;
option java_package = "com.gym.proto.trainer.v1";
option (openapi.v3.document) = {
  components: {
    security_schemes: {
      additional_properties: [
        {
          name: "BearerAuth"
          value: {
            security_scheme: {
              type: "http"
              scheme: "bearer"
              bearer_format: "JWT"
            }
          }
        }
      ]
    }
  }
  security: [
    {
      additional_properties: [
        {
          name: "BearerAuth"
          value: {
            value: []
          }
        }
      ]
    }
  ]
};

enum TrainerStatus {
  TRAINER_STATUS_UNSPECIFIED = 0;
  TRAINER_STATUS_ACTIVE = 1;
  reserved 2;
  reserved "TRAINER_STATUS_SUSPENDED";
  TRAINER_STATUS_INACTIVE = 3;
}

service TrainerService {
  rpc SearchTrainers(SearchTrainersRequest) returns (SearchTrainersResponse) {
    option (google.api.http) = {get: "/api/v1/trainers"};
  }
  rpc GetTrainerProfile(GetTrainerProfileRequest) returns (GetTrainerProfileResponse) {
    option (google.api.http) = {get: "/api/v1/trainers/{id}"};
  }
  rpc GetAvailableSlots(GetAvailableSlotsRequest) returns (GetAvailableSlotsResponse) {
    option (google.api.http) = {get: "/api/v1/trainers/slots"};
  }
  rpc UpdateMyProfile(UpdateMyProfileRequest) returns (UpdateMyProfileResponse) {
    option (google.api.http) = {
      put: "/api/v1/trainers/profile"
      body: "*"
    };
  }
  rpc SetAvailability(SetAvailabilityRequest) returns (SetAvailabilityResponse) {
    option (google.api.http) = {
      post: "/api/v1/trainers/availability"
      body: "*"
    };
  }
  rpc CreateTrainer(CreateTrainerRequest) returns (CreateTrainerResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/trainer-profiles"
      body: "*"
    };
  }
  rpc SuspendTrainer(SuspendTrainerRequest) returns (SuspendTrainerResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/trainers/{trainer_id}/suspend"
      body: "*"
    };
  }
  rpc ListTrainers(ListTrainersRequest) returns (ListTrainersResponse) {
    option (google.api.http) = {get: "/api/v1/admin/trainers"};
  }
}

message SearchTrainersRequest {
  string gym_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string specialty = 2 [(buf.validate.field).string = {max_len: 100}];
}

message SearchTrainersResponse {
  repeated GetTrainerProfileResponse trainers = 1;

  option (openapi.v3.schema) = {
    example: {yaml: "trainers:\n  - id: trainer_example_01\n    userId: user_example_01\n    gymId: gym_example_01\n    displayName: Trainer Example\n    avatarUrl: https://images.example.invalid/trainers/trainer_example_01.png\n    bio: Strength coach\n    specialties:\n      - strength\n    certifications:\n      - CPT\n    status: TRAINER_STATUS_ACTIVE\n"}
  };
}

message GetTrainerProfileRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message GetTrainerProfileResponse {
  string id = 1;
  string user_id = 2;
  string gym_id = 3;
  string display_name = 4;
  string avatar_url = 5;
  string bio = 6;
  repeated string specialties = 7;
  repeated string certifications = 8;
  reserved 9;
  reserved "hourly_rate_vnd";
  TrainerStatus status = 10;

  option (openapi.v3.schema) = {
    example: {yaml: "id: trainer_example_01\nuserId: user_example_01\ngymId: gym_example_01\ndisplayName: Trainer Example\navatarUrl: https://images.example.invalid/trainers/trainer_example_01.png\nbio: Strength coach\nspecialties:\n  - strength\ncertifications:\n  - CPT\nstatus: TRAINER_STATUS_ACTIVE\n"}
  };
}

message GetAvailableSlotsRequest {
  string trainer_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string date = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"
  }];
}

message GetAvailableSlotsResponse {
  repeated string available_slots = 1;

  option (openapi.v3.schema) = {
    example: {yaml: "availableSlots:\n  - 09:00-10:00\n  - 10:00-11:00\n"}
  };
}

message UpdateMyProfileRequest {
  string display_name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  string avatar_url = 2 [(buf.validate.field) = {
    ignore: IGNORE_IF_ZERO_VALUE
    string: {
      max_len: 2048
      uri: true
    }
  }];
  string bio = 3 [(buf.validate.field).string = {max_len: 2000}];
  repeated string specialties = 4 [(buf.validate.field).repeated = {
    max_items: 50
    items: {
      string: {max_len: 100}
    }
  }];
  repeated string certifications = 5 [(buf.validate.field).repeated = {
    max_items: 50
    items: {
      string: {max_len: 200}
    }
  }];
}

message UpdateMyProfileResponse {
  string id = 1;
  string user_id = 2;
  string gym_id = 3;
  string display_name = 4;
  string avatar_url = 5;
  string bio = 6;
  repeated string specialties = 7;
  repeated string certifications = 8;
  reserved 9;
  reserved "hourly_rate_vnd";
  TrainerStatus status = 10;

  option (openapi.v3.schema) = {
    example: {yaml: "id: trainer_example_01\nuserId: user_example_01\ngymId: gym_example_01\ndisplayName: Trainer Example\navatarUrl: https://images.example.invalid/trainers/trainer_example_01.png\nbio: Strength coach\nspecialties:\n  - strength\ncertifications:\n  - CPT\nstatus: TRAINER_STATUS_ACTIVE\n"}
  };
}

message AvailabilitySlot {
  int32 day_of_week = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 6
  }];
  string start_time = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 8
    pattern: "^\\d{2}:\\d{2}$"
  }];
  string end_time = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 8
    pattern: "^\\d{2}:\\d{2}$"
  }];
  reserved 4;
  reserved "is_recurring";
  string specific_date = 5 [(buf.validate.field).string = {
    max_len: 32
    pattern: "^$|^\\d{4}-\\d{2}-\\d{2}$"
  }];
  bool is_blocked = 6;
}

message SetAvailabilityRequest {
  repeated AvailabilitySlot slots = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
  }];
}

message SetAvailabilityResponse {
  repeated AvailabilitySlot slots = 1;

  option (openapi.v3.schema) = {
    example: {yaml: "slots:\n  - dayOfWeek: 1\n    startTime: 09:00\n    endTime: 10:00\n    specificDate: ''\n    isBlocked: false\n"}
  };
}

message CreateTrainerRequest {
  string user_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string gym_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  repeated string specialties = 3 [(buf.validate.field).repeated = {
    max_items: 50
    items: {
      string: {max_len: 100}
    }
  }];
}

message CreateTrainerResponse {
  string id = 1;
  string user_id = 2;
  string gym_id = 3;
  string display_name = 4;
  string avatar_url = 5;
  string bio = 6;
  repeated string specialties = 7;
  repeated string certifications = 8;
  reserved 9;
  reserved "hourly_rate_vnd";
  TrainerStatus status = 10;

  option (openapi.v3.schema) = {
    example: {yaml: "id: trainer_example_01\nuserId: user_example_01\ngymId: gym_example_01\ndisplayName: Trainer Example\navatarUrl: https://images.example.invalid/trainers/trainer_example_01.png\nbio: Strength coach\nspecialties:\n  - strength\ncertifications:\n  - CPT\nstatus: TRAINER_STATUS_ACTIVE\n"}
  };
}

message SuspendTrainerRequest {
  string trainer_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message SuspendTrainerResponse {
  string trainer_id = 1;

  option (openapi.v3.schema) = {
    example: {yaml: "trainerId: trainer_example_01\n"}
  };
}

message ListTrainersRequest {
  string gym_id = 1 [(buf.validate.field).string = {max_len: 128}];
  TrainerStatus status = 2 [(buf.validate.field) = {
    ignore: IGNORE_IF_ZERO_VALUE
    enum: {defined_only: true}
  }];
}

message ListTrainersResponse {
  repeated GetTrainerProfileResponse trainers = 1;

  option (openapi.v3.schema) = {
    example: {yaml: "trainers:\n  - id: trainer_example_01\n    userId: user_example_01\n    gymId: gym_example_01\n    displayName: Trainer Example\n    avatarUrl: https://images.example.invalid/trainers/trainer_example_01.png\n    bio: Strength coach\n    specialties:\n      - strength\n    certifications:\n      - CPT\n    status: TRAINER_STATUS_ACTIVE\n"}
  };
}
