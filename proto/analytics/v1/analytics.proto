syntax = "proto3";

package analytics.v1;

import "buf/validate/validate.proto";
import "common/v1/common.proto";

option go_package = "github.com/pploc/proto-go/analytics/v1;analyticsv1";
option java_multiple_files = true;
option java_package = "com.gym.proto.analytics.v1";

service AnalyticsService {
  rpc GetDailyAttendance(GetDailyAttendanceRequest) returns (GetDailyAttendanceResponse);
  rpc GetAttendanceTrend(GetAttendanceTrendRequest) returns (GetAttendanceTrendResponse);
  rpc GetMembershipStats(GetMembershipStatsRequest) returns (GetMembershipStatsResponse);
  rpc GetInactiveMembers(GetInactiveMembersRequest) returns (GetInactiveMembersResponse);
  rpc GetRevenueReport(GetRevenueReportRequest) returns (GetRevenueReportResponse);
  rpc GetRevenueComparison(GetRevenueComparisonRequest) returns (GetRevenueComparisonResponse);
  rpc GetTrainerUtilization(GetTrainerUtilizationRequest) returns (GetTrainerUtilizationResponse);
  rpc GetDashboardSummary(GetDashboardSummaryRequest) returns (GetDashboardSummaryResponse);
}

message GetDailyAttendanceRequest {
  string gym_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string start_date = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"
  }];
  string end_date = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"
  }];
  option (buf.validate.message).cel = {
    id: "attendance_date_order"
    message: "end_date must be on or after start_date"
    expression: "this.start_date <= this.end_date"
  };
}

message DailyAttendance {
  string date = 1;
  int32 total_checkins = 2;
  int32 unique_members = 3;
  int32 peak_hour = 4;
}

message GetDailyAttendanceResponse {
  repeated DailyAttendance attendance = 1;
}

message GetAttendanceTrendRequest {
  string gym_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  int32 days = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 365
  }];
}

message TrendPoint {
  string date = 1;
  int32 count = 2;
  double change_pct = 3;
}

message GetAttendanceTrendResponse {
  repeated TrendPoint points = 1;
}

message GetMembershipStatsRequest {
  string gym_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string date = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"
  }];
}

message GetMembershipStatsResponse {
  string date = 1;
  int32 active_count = 2;
  int32 paused_count = 3;
  int32 expired_count = 4;
  int32 new_count = 5;
  int32 churned_count = 6;
}

message GetInactiveMembersRequest {
  string gym_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  int32 inactive_days_threshold = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 3650
  }];
}

message InactiveMember {
  string member_id = 1;
  string full_name = 2;
  string phone = 3;
  string last_checkin = 4;
  int32 inactive_days = 5;
  common.v1.RiskLevel risk_level = 6;
}

message GetInactiveMembersResponse {
  repeated InactiveMember members = 1;
}

message GetRevenueReportRequest {
  string gym_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string month = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 7
    pattern: "^\\d{4}-\\d{2}$"
  }];
}

message GetRevenueReportResponse {
  int64 total_revenue_vnd = 1;
  int64 membership_revenue_vnd = 2;
  int64 trainer_revenue_vnd = 3;
}

message GetRevenueComparisonRequest {
  string gym_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  int32 months = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 36
  }];
}

message GetRevenueComparisonResponse {
  message MonthlyRevenue {
    string month = 1;
    int64 total = 2;
  }
  repeated MonthlyRevenue revenue_history = 1;
}

message GetTrainerUtilizationRequest {
  string trainer_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string month = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 7
    pattern: "^\\d{4}-\\d{2}$"
  }];
}

message GetTrainerUtilizationResponse {
  string trainer_id = 1;
  string month = 2;
  int32 total_bookings = 3;
  int32 completed_bookings = 4;
  int32 cancelled_bookings = 5;
  double total_hours = 6;
  double utilization_pct = 7;
}

message GetDashboardSummaryRequest {
  string gym_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message GetDashboardSummaryResponse {
  int32 today_checkins = 1;
  int32 active_members = 2;
  int64 month_revenue_vnd = 3;
  double attendance_trend_pct = 4;
  int32 at_risk_members = 5;
  int32 ghost_members = 6;
}
