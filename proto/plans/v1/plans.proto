syntax = "proto3";

package plans.v1;

import "buf/validate/validate.proto";
import "common/v1/common.proto";
import "google/api/annotations.proto";
import "openapiv3/annotations.proto";

option go_package = "github.com/pploc/proto-go/plans/v1;plansv1";
option java_multiple_files = true;
option java_package = "com.gym.proto.plans.v1";
option (openapi.v3.document) = {
  components: {
    security_schemes: {
      additional_properties: [
        {
          name: "BearerAuth"
          value: {
            security_scheme: {
              type: "http"
              scheme: "bearer"
              bearer_format: "JWT"
            }
          }
        }
      ]
    }
  }
};

enum GymLocationStatus {
  GYM_LOCATION_STATUS_UNSPECIFIED = 0;
  GYM_LOCATION_STATUS_ACTIVE = 1;
  GYM_LOCATION_STATUS_CLOSED = 2;
}

service PlansService {
  rpc CreateGymLocation(CreateGymLocationRequest) returns (CreateGymLocationResponse) {
    option (google.api.http) = {
      post: "/api/v1/gyms"
      body: "*"
    };

    option (openapi.v3.operation) = {
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {
                value: []
              }
            }
          ]
        }
      ]
    };
  }
  rpc UpdateGymLocation(UpdateGymLocationRequest) returns (UpdateGymLocationResponse) {
    option (google.api.http) = {
      put: "/api/v1/gyms/{id}"
      body: "*"
    };

    option (openapi.v3.operation) = {
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {
                value: []
              }
            }
          ]
        }
      ]
    };
  }
  rpc GetGymLocation(GetGymLocationRequest) returns (GetGymLocationResponse) {
    option (google.api.http) = {get: "/api/v1/gyms/{id}"};

    option (openapi.v3.operation) = {
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {
                value: []
              }
            }
          ]
        }
      ]
    };
  }
  rpc ListGymLocations(ListGymLocationsRequest) returns (ListGymLocationsResponse) {
    option (google.api.http) = {get: "/api/v1/gyms"};

    option (openapi.v3.operation) = {
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {
                value: []
              }
            }
          ]
        }
      ]
    };
  }
  rpc CreateMembershipPlan(CreateMembershipPlanRequest) returns (CreateMembershipPlanResponse) {
    option (google.api.http) = {
      post: "/api/v1/gyms/{gym_id}/plans"
      body: "*"
    };

    option (openapi.v3.operation) = {
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {
                value: []
              }
            }
          ]
        }
      ]
    };
  }
  rpc UpdateMembershipPlan(UpdateMembershipPlanRequest) returns (UpdateMembershipPlanResponse) {
    option (google.api.http) = {
      put: "/api/v1/plans/{id}"
      body: "*"
    };

    option (openapi.v3.operation) = {
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {
                value: []
              }
            }
          ]
        }
      ]
    };
  }
  rpc GetMembershipPlan(GetMembershipPlanRequest) returns (GetMembershipPlanResponse) {
    option (google.api.http) = {get: "/api/v1/plans/{id}"};

    option (openapi.v3.operation) = {
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {
                value: []
              }
            }
          ]
        }
      ]
    };
  }
  rpc ListMembershipPlans(ListMembershipPlansRequest) returns (ListMembershipPlansResponse) {
    option (google.api.http) = {get: "/api/v1/gyms/{gym_id}/plans"};

    option (openapi.v3.operation) = {
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {
                value: []
              }
            }
          ]
        }
      ]
    };
  }

  // Internal only. Requires the verified ms-gym-identifier workload identity.
  // This RPC is intentionally absent from the external HTTP configuration.
  rpc GetActiveGym(GetActiveGymRequest) returns (GetActiveGymResponse);

  // Internal only. Requires the verified ms-gym-member workload identity.
  // This RPC is intentionally absent from the external HTTP configuration.
  rpc ResolvePurchasablePlan(ResolvePurchasablePlanRequest) returns (ResolvePurchasablePlanResponse);

  // Internal only. Requires the verified ms-gym-checkin workload identity.
  // This RPC is intentionally absent from the external HTTP configuration.
  rpc ValidateCheckInGym(ValidateCheckInGymRequest) returns (ValidateCheckInGymResponse);

  // Internal only. Requires the verified ms-gym-trainer workload identity.
  // This RPC is intentionally absent from the external HTTP configuration.
  rpc ValidateTrainerGym(ValidateTrainerGymRequest) returns (ValidateTrainerGymResponse);
}

message CreateGymLocationRequest {
  string chain_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  string address = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }];
  string city = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
}

message UpdateGymLocationRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string chain_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string name = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  string address = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }];
  string city = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  GymLocationStatus status = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

message GetGymLocationRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message ListGymLocationsRequest {
  string chain_id = 1 [(buf.validate.field).string = {max_len: 128}];
  string city = 2 [(buf.validate.field).string = {max_len: 100}];
  GymLocationStatus status = 3 [(buf.validate.field) = {
    ignore: IGNORE_IF_ZERO_VALUE
    enum: {defined_only: true}
  }];
}

message CreateGymLocationResponse {
  option (openapi.v3.schema) = {
    example: {yaml: "id: gym_example_01\nchainId: chain_example_01\nname: Downtown Gym\naddress: 100 Example Street\ncity: Example City\nstatus: GYM_LOCATION_STATUS_ACTIVE\n"}
  };
  string id = 1;
  string chain_id = 2;
  string name = 3;
  string address = 4;
  string city = 5;
  GymLocationStatus status = 6;
}

message UpdateGymLocationResponse {
  option (openapi.v3.schema) = {
    example: {yaml: "id: gym_example_01\nchainId: chain_example_01\nname: Downtown Gym\naddress: 100 Example Street\ncity: Example City\nstatus: GYM_LOCATION_STATUS_ACTIVE\n"}
  };
  string id = 1;
  string chain_id = 2;
  string name = 3;
  string address = 4;
  string city = 5;
  GymLocationStatus status = 6;
}

message GetGymLocationResponse {
  option (openapi.v3.schema) = {
    example: {yaml: "id: gym_example_01\nchainId: chain_example_01\nname: Downtown Gym\naddress: 100 Example Street\ncity: Example City\nstatus: GYM_LOCATION_STATUS_ACTIVE\n"}
  };
  string id = 1;
  string chain_id = 2;
  string name = 3;
  string address = 4;
  string city = 5;
  GymLocationStatus status = 6;
}

message ListGymLocationsResponse {
  option (openapi.v3.schema) = {
    example: {yaml: "locations:\n  - id: gym_example_01\n    chainId: chain_example_01\n    name: Downtown Gym\n    address: 100 Example Street\n    city: Example City\n    status: GYM_LOCATION_STATUS_ACTIVE\n"}
  };
  repeated GetGymLocationResponse locations = 1;
}

message CreateMembershipPlanRequest {
  string gym_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  common.v1.PlanType plan_type = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional int32 duration_days = 4 [(buf.validate.field).int32 = {
    gte: 1
    lte: 3660
  }];
  int64 price_vnd = 5 [(buf.validate.field).int64 = {
    gte: 0
    lte: 100000000000
  }];
  string description = 6 [(buf.validate.field).string = {max_len: 2000}];
  optional bool active = 7;
  option (buf.validate.message).cel = {
    id: "create_plan_lifetime_duration"
    message: "LIFETIME plans must omit duration_days; non-LIFETIME plans require duration_days"
    expression: "this.plan_type == 3 ? !has(this.duration_days) : has(this.duration_days)"
  };
}

message UpdateMembershipPlanRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  common.v1.PlanType plan_type = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional int32 duration_days = 4 [(buf.validate.field).int32 = {
    gte: 1
    lte: 3660
  }];
  int64 price_vnd = 5 [(buf.validate.field).int64 = {
    gte: 0
    lte: 100000000000
  }];
  string description = 6 [(buf.validate.field).string = {max_len: 2000}];
  bool active = 7;
  option (buf.validate.message).cel = {
    id: "update_plan_lifetime_duration"
    message: "LIFETIME plans must omit duration_days; non-LIFETIME plans require duration_days"
    expression: "this.plan_type == 3 ? !has(this.duration_days) : has(this.duration_days)"
  };
}

message GetMembershipPlanRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message ListMembershipPlansRequest {
  string gym_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  common.v1.PlanType plan_type = 2 [(buf.validate.field) = {
    ignore: IGNORE_IF_ZERO_VALUE
    enum: {defined_only: true}
  }];
  optional bool active = 3;
}

message CreateMembershipPlanResponse {
  option (openapi.v3.schema) = {
    example: {yaml: "id: plan_example_01\ngymId: gym_example_01\nname: Monthly Membership\nplanType: PLAN_TYPE_MONTHLY\ndurationDays: 30\npriceVnd: '299000'\ndescription: Monthly membership\nactive: true\n"}
  };
  string id = 1;
  string gym_id = 2;
  string name = 3;
  common.v1.PlanType plan_type = 4;
  optional int32 duration_days = 5;
  int64 price_vnd = 6;
  string description = 7;
  bool active = 8;
}

message UpdateMembershipPlanResponse {
  option (openapi.v3.schema) = {
    example: {yaml: "id: plan_example_01\ngymId: gym_example_01\nname: Monthly Membership\nplanType: PLAN_TYPE_MONTHLY\ndurationDays: 30\npriceVnd: '299000'\ndescription: Monthly membership\nactive: true\n"}
  };
  string id = 1;
  string gym_id = 2;
  string name = 3;
  common.v1.PlanType plan_type = 4;
  optional int32 duration_days = 5;
  int64 price_vnd = 6;
  string description = 7;
  bool active = 8;
}

message GetMembershipPlanResponse {
  option (openapi.v3.schema) = {
    example: {yaml: "id: plan_example_01\ngymId: gym_example_01\nname: Monthly Membership\nplanType: PLAN_TYPE_MONTHLY\ndurationDays: 30\npriceVnd: '299000'\ndescription: Monthly membership\nactive: true\n"}
  };
  string id = 1;
  string gym_id = 2;
  string name = 3;
  common.v1.PlanType plan_type = 4;
  optional int32 duration_days = 5;
  int64 price_vnd = 6;
  string description = 7;
  bool active = 8;
}

message ListMembershipPlansResponse {
  option (openapi.v3.schema) = {
    example: {yaml: "plans:\n  - id: plan_example_01\n    gymId: gym_example_01\n    name: Monthly Membership\n    planType: PLAN_TYPE_MONTHLY\n    durationDays: 30\n    priceVnd: '299000'\n    description: Monthly membership\n    active: true\n"}
  };
  repeated GetMembershipPlanResponse plans = 1;
}

message GetActiveGymRequest {
  string gym_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message GetActiveGymResponse {
  string id = 1;
  string chain_id = 2;
  string name = 3;
  string address = 4;
  string city = 5;
  GymLocationStatus status = 6;
}

message ResolvePurchasablePlanRequest {
  string plan_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string gym_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message ResolvePurchasablePlanResponse {
  string plan_id = 1;
  string gym_id = 2;
  common.v1.PlanType plan_type = 3;
  optional int32 duration_days = 4;
  int64 price_vnd = 5;
}

message ValidateCheckInGymRequest {
  string gym_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message ValidateCheckInGymResponse {
  string gym_id = 1;
  GymLocationStatus status = 2;
}

message ValidateTrainerGymRequest {
  string gym_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message ValidateTrainerGymResponse {
  string gym_id = 1;
  GymLocationStatus status = 2;
}
