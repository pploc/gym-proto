syntax = "proto3";

package notification.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/pploc/proto-go/notification/v1;notificationv1";
option java_multiple_files = true;
option java_package = "com.gym.proto.notification.v1";

enum NotificationChannel {
  NOTIFICATION_CHANNEL_UNSPECIFIED = 0;
  NOTIFICATION_CHANNEL_SMS = 1;
  NOTIFICATION_CHANNEL_EMAIL = 2;
  NOTIFICATION_CHANNEL_PUSH = 3;
}

enum NotificationStatus {
  NOTIFICATION_STATUS_UNSPECIFIED = 0;
  NOTIFICATION_STATUS_PENDING = 1;
  NOTIFICATION_STATUS_SENT = 2;
  NOTIFICATION_STATUS_FAILED = 3;
  NOTIFICATION_STATUS_READ = 4;
}

enum DevicePlatform {
  DEVICE_PLATFORM_UNSPECIFIED = 0;
  DEVICE_PLATFORM_IOS = 1;
  DEVICE_PLATFORM_ANDROID = 2;
}

service NotificationService {
  rpc GetMyNotifications(GetMyNotificationsRequest) returns (GetMyNotificationsResponse);
  rpc MarkAsRead(MarkAsReadRequest) returns (MarkAsReadResponse);

  rpc GetPreferences(GetPreferencesRequest) returns (GetPreferencesResponse);
  rpc UpdatePreferences(UpdatePreferencesRequest) returns (UpdatePreferencesResponse);

  rpc RegisterDevice(RegisterDeviceRequest) returns (RegisterDeviceResponse);
  rpc UnregisterDevice(UnregisterDeviceRequest) returns (UnregisterDeviceResponse);

  rpc SendBulkNotification(SendBulkNotificationRequest) returns (SendBulkNotificationResponse);
}

message GetMyNotificationsRequest {
  string user_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  int32 limit = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
}

message NotificationMessage {
  string id = 1;
  string user_id = 2;
  NotificationChannel channel = 3;
  string event_type = 4;
  string title = 5;
  string body = 6;
  NotificationStatus status = 7;
  string sent_at = 8;
}

message GetMyNotificationsResponse {
  repeated NotificationMessage notifications = 1;
}

message MarkAsReadRequest {
  string notification_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string user_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message MarkAsReadResponse {}

message Preference {
  NotificationChannel channel = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  bool enabled = 2;
}

message GetPreferencesRequest {}

message GetPreferencesResponse {
  repeated Preference preferences = 1;
}

message UpdatePreferencesRequest {
  string user_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  repeated Preference preferences = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 10
  }];
}

message UpdatePreferencesResponse {
  repeated Preference preferences = 1;
}

message RegisterDeviceRequest {
  string user_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string device_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string fcm_token = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4096
  }];
  DevicePlatform platform = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

message RegisterDeviceResponse {}

message UnregisterDeviceRequest {
  string user_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string device_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message UnregisterDeviceResponse {}

message SendBulkNotificationRequest {
  string title = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  string body = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2000
  }];
  repeated string target_user_ids = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 1000
    items: {
      string: {
        min_len: 1
        max_len: 128
      }
    }
  }];
}

message SendBulkNotificationResponse {
  int32 sent_count = 1;
}
