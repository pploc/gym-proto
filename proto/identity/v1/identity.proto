syntax = "proto3";

package identity.v1;

import "buf/validate/validate.proto";
import "common/v1/common.proto";
import "google/api/annotations.proto";
import "openapiv3/annotations.proto";

option go_package = "github.com/pploc/proto-go/identity/v1;identityv1";
option java_multiple_files = true;
option java_package = "com.gym.proto.identity.v1";
option (openapi.v3.document) = {
  components: {
    security_schemes: {
      additional_properties: [
        {
          name: "BearerAuth"
          value: {
            security_scheme: {
              type: "http"
              scheme: "bearer"
              bearer_format: "JWT"
            }
          }
        }
      ]
    }
  }
};

service IdentityService {
  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/register"
      body: "*"
    };
  }
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/login"
      body: "*"
    };
  }
  rpc LoginWithGoogle(LoginWithGoogleRequest) returns (LoginWithGoogleResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/oauth/google"
      body: "*"
    };
  }
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/refresh"
      body: "*"
    };
  }
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/email/verify"
      body: "*"
    };
  }
  rpc ResendEmailVerification(ResendEmailVerificationRequest) returns (ResendEmailVerificationResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/email/resend"
      body: "*"
    };
  }
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/logout"
      body: "*"
    };
    option (openapi.v3.operation) = {
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {
                value: []
              }
            }
          ]
        }
      ]
    };
  }
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse) {
    option (google.api.http) = {get: "/api/v1/users/me"};

    option (openapi.v3.operation) = {
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {
                value: []
              }
            }
          ]
        }
      ]
    };
  }
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse) {
    option (google.api.http) = {
      post: "/api/v1/users/password"
      body: "*"
    };

    option (openapi.v3.operation) = {
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {
                value: []
              }
            }
          ]
        }
      ]
    };
  }
  rpc CreateTrainerAccount(CreateTrainerAccountRequest) returns (CreateTrainerAccountResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/trainers"
      body: "*"
    };

    option (openapi.v3.operation) = {
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {
                value: []
              }
            }
          ]
        }
      ]
    };
  }
  rpc SuspendUser(SuspendUserRequest) returns (SuspendUserResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/users/{user_id}/suspend"
      body: "*"
    };

    option (openapi.v3.operation) = {
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {
                value: []
              }
            }
          ]
        }
      ]
    };
  }
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {get: "/api/v1/admin/users"};

    option (openapi.v3.operation) = {
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {
                value: []
              }
            }
          ]
        }
      ]
    };
  }

  // Internal only. Requires verified ms-gym-trainer workload identity.
  // This RPC is intentionally absent from HTTP/OpenAPI/Kong routing.
  rpc ValidateTrainerAccount(ValidateTrainerAccountRequest) returns (ValidateTrainerAccountResponse);
}

message RegisterRequest {
  string email = 1 [(buf.validate.field).string = {
    email: true
    max_len: 320
  }];
  string password = 2 [(buf.validate.field).string = {
    min_len: 8
    max_len: 128
  }];
  string full_name = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  reserved 4, 5;
  reserved "role", "gym_id";
}

message LoginRequest {
  string email = 1 [(buf.validate.field).string = {
    email: true
    max_len: 320
  }];
  string password = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message LoginWithGoogleRequest {
  string id_token = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 8192
  }];
}

message RefreshTokenRequest {
  string refresh_token = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
  }];
}

message VerifyEmailRequest {
  string verification_token = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
  }];
}

message ResendEmailVerificationRequest {
  string email = 1 [(buf.validate.field).string = {
    email: true
    max_len: 320
  }];
}

message LogoutRequest {
  string access_token = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4096
  }];
}

message GetCurrentUserRequest {}

message ChangePasswordRequest {
  string old_password = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string new_password = 2 [(buf.validate.field).string = {
    min_len: 8
    max_len: 128
  }];
}

message CreateTrainerAccountRequest {
  string email = 1 [(buf.validate.field).string = {
    email: true
    max_len: 320
  }];
  string temp_password = 2 [(buf.validate.field).string = {
    min_len: 8
    max_len: 128
  }];
  string gym_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message SuspendUserRequest {
  string user_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message ListUsersRequest {
  int32 page = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100000
  }];
  int32 limit = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  string gym_id = 3 [(buf.validate.field).string = {max_len: 128}];
}

message ValidateTrainerAccountRequest {
  string user_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message ValidateTrainerAccountResponse {
  string user_id = 1;
  common.v1.Role role = 2;
  common.v1.UserStatus status = 3;
}

message RegisterResponse {
  option (openapi.v3.schema) = {
    example: {yaml: "status: USER_STATUS_PENDING_VERIFICATION\n"}
  };
  string access_token = 1;
  string refresh_token = 2;
  int32 expires_in = 3;
  common.v1.UserStatus status = 4;
}

message LoginResponse {
  option (openapi.v3.schema) = {
    example: {yaml: "accessToken: redacted-access-token\nrefreshToken: redacted-refresh-token\nexpiresIn: 900\nstatus: USER_STATUS_ACTIVE\n"}
  };
  string access_token = 1;
  string refresh_token = 2;
  int32 expires_in = 3;
  common.v1.UserStatus status = 4;
}

message LoginWithGoogleResponse {
  option (openapi.v3.schema) = {
    example: {yaml: "accessToken: redacted-access-token\nrefreshToken: redacted-refresh-token\nexpiresIn: 900\nstatus: USER_STATUS_ACTIVE\n"}
  };
  string access_token = 1;
  string refresh_token = 2;
  int32 expires_in = 3;
  common.v1.UserStatus status = 4;
}

message RefreshTokenResponse {
  option (openapi.v3.schema) = {
    example: {yaml: "accessToken: redacted-access-token\nrefreshToken: redacted-refresh-token\nexpiresIn: 900\nstatus: USER_STATUS_ACTIVE\n"}
  };
  string access_token = 1;
  string refresh_token = 2;
  int32 expires_in = 3;
  common.v1.UserStatus status = 4;
}

message VerifyEmailResponse {
  option (openapi.v3.schema) = {
    example: {yaml: "accessToken: redacted-access-token\nrefreshToken: redacted-refresh-token\nexpiresIn: 900\nstatus: USER_STATUS_ACTIVE\n"}
  };
  string access_token = 1;
  string refresh_token = 2;
  int32 expires_in = 3;
  common.v1.UserStatus status = 4;
}

message ResendEmailVerificationResponse {}

message LogoutResponse {}

message GetCurrentUserResponse {
  option (openapi.v3.schema) = {
    example: {yaml: "id: user_example_01\nemail: member@example.invalid\nrole: ROLE_CUSTOMER\nstatus: USER_STATUS_ACTIVE\nfullName: Member Example\nphone: +15555550100\nemailVerified: true\n"}
  };
  string id = 1;
  string email = 2;
  common.v1.Role role = 3;
  common.v1.UserStatus status = 4;
  string full_name = 5;
  string phone = 6;
  reserved 7;
  reserved "gym_id";
  bool email_verified = 8;
}

message ChangePasswordResponse {}

message CreateTrainerAccountResponse {
  option (openapi.v3.schema) = {
    example: {yaml: "id: trainer_example_01\nemail: trainer@example.invalid\nrole: ROLE_TRAINER\nstatus: USER_STATUS_ACTIVE\nfullName: Trainer Example\nemailVerified: true\n"}
  };
  string id = 1;
  string email = 2;
  common.v1.Role role = 3;
  common.v1.UserStatus status = 4;
  string full_name = 5;
  string phone = 6;
  reserved 7;
  reserved "gym_id";
  bool email_verified = 8;
}

message SuspendUserResponse {}

message ListUsersResponse {
  option (openapi.v3.schema) = {
    example: {yaml: "users:\n  - id: user_example_01\n    email: member@example.invalid\n    role: ROLE_CUSTOMER\n    status: USER_STATUS_ACTIVE\n    fullName: Member Example\n    emailVerified: true\ntotal: 1\n"}
  };
  repeated GetCurrentUserResponse users = 1;
  int32 total = 2;
}
