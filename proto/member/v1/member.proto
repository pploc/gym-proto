syntax = "proto3";

package member.v1;

import "buf/validate/validate.proto";
import "common/v1/common.proto";
import "google/api/annotations.proto";
import "openapiv3/annotations.proto";

option go_package = "github.com/pploc/proto-go/member/v1;memberv1";
option java_multiple_files = true;
option java_package = "com.gym.proto.member.v1";
option (openapi.v3.document) = {
  components: {
    security_schemes: {
      additional_properties: [
        {
          name: "BearerAuth"
          value: {
            security_scheme: {
              type: "http"
              scheme: "bearer"
              bearer_format: "JWT"
            }
          }
        }
      ]
    }
  }
};

service MemberService {
  rpc GetMember(GetMemberRequest) returns (GetMemberResponse) {
    option (google.api.http) = {get: "/api/v1/members/{member_id}"};

    option (openapi.v3.operation) = {
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {
                value: []
              }
            }
          ]
        }
      ]
    };
  }
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse) {
    option (google.api.http) = {
      put: "/api/v1/members/{member_id}"
      body: "*"
    };

    option (openapi.v3.operation) = {
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {
                value: []
              }
            }
          ]
        }
      ]
    };
  }
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse) {
    option (google.api.http) = {get: "/api/v1/gyms/{gym_id}/members"};

    option (openapi.v3.operation) = {
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {
                value: []
              }
            }
          ]
        }
      ]
    };
  }
  rpc PurchaseMembership(PurchaseMembershipRequest) returns (PurchaseMembershipResponse) {
    option (google.api.http) = {
      post: "/api/v1/gyms/{gym_id}/memberships/purchase"
      body: "purchase"
    };

    option (openapi.v3.operation) = {
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {
                value: []
              }
            }
          ]
        }
      ]
    };
  }
  rpc PauseMembership(PauseMembershipRequest) returns (PauseMembershipResponse) {
    option (google.api.http) = {
      post: "/api/v1/gyms/{gym_id}/members/{member_id}/membership:pause"
      body: "*"
    };

    option (openapi.v3.operation) = {
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {
                value: []
              }
            }
          ]
        }
      ]
    };
  }
  rpc ResumeMembership(ResumeMembershipRequest) returns (ResumeMembershipResponse) {
    option (google.api.http) = {
      post: "/api/v1/gyms/{gym_id}/members/{member_id}/membership:resume"
      body: "*"
    };

    option (openapi.v3.operation) = {
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {
                value: []
              }
            }
          ]
        }
      ]
    };
  }
  rpc GetMembershipStatus(GetMembershipStatusRequest) returns (GetMembershipStatusResponse) {
    option (google.api.http) = {get: "/api/v1/gyms/{gym_id}/members/{member_id}/membership"};

    option (openapi.v3.operation) = {
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {
                value: []
              }
            }
          ]
        }
      ]
    };
  }

  // Internal only. Requires the verified ms-gym-checkin workload identity.
  // This RPC is intentionally absent from the external HTTP configuration.
  rpc ValidateMembership(ValidateMembershipRequest) returns (ValidateMembershipResponse);
  // Internal only. Requires the verified ms-gym-notification workload identity.
  // This RPC is intentionally absent from the external HTTP configuration.
  rpc ListMembersByStatus(ListMembersByStatusRequest) returns (ListMembersByStatusResponse);
}

message GetMemberRequest {
  string member_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message GetMemberResponse {
  option (openapi.v3.schema) = {
    example: {yaml: "id: member_example_01\nuserId: user_example_01\nfullName: Member Example\nphone: +15555550100\navatarUrl: https://images.example.invalid/members/member_example_01.png\ndateOfBirth: 1990-01-01\nstatus: MEMBERSHIP_STATUS_ACTIVE\n"}
  };
  string id = 1;
  string user_id = 2;
  reserved 3;
  reserved "gym_id";
  string full_name = 4;
  string phone = 5;
  string avatar_url = 6;
  string date_of_birth = 7;
  common.v1.MembershipStatus status = 8;
}

message UpdateProfileRequest {
  string member_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string full_name = 2 [(buf.validate.field).string = {max_len: 200}];
  string phone = 3 [(buf.validate.field).string = {max_len: 32}];
  string avatar_url = 4 [(buf.validate.field) = {
    ignore: IGNORE_IF_ZERO_VALUE
    string: {
      max_len: 2048
      uri: true
    }
  }];
  string date_of_birth = 5 [(buf.validate.field).string = {
    max_len: 32
    pattern: "^$|^\\d{4}-\\d{2}-\\d{2}$"
  }];
}

message UpdateProfileResponse {
  option (openapi.v3.schema) = {
    example: {yaml: "id: member_example_01\nuserId: user_example_01\nfullName: Member Example\nphone: +15555550100\navatarUrl: https://images.example.invalid/members/member_example_01.png\ndateOfBirth: 1990-01-01\nstatus: MEMBERSHIP_STATUS_ACTIVE\n"}
  };
  string id = 1;
  string user_id = 2;
  reserved 3;
  reserved "gym_id";
  string full_name = 4;
  string phone = 5;
  string avatar_url = 6;
  string date_of_birth = 7;
  common.v1.MembershipStatus status = 8;
}

message ListMembersRequest {
  int32 page = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100000
  }];
  int32 limit = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  string gym_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message ListMembersResponse {
  option (openapi.v3.schema) = {
    example: {yaml: "members:\n  - id: member_example_01\n    userId: user_example_01\n    fullName: Member Example\n    phone: +15555550100\n    status: MEMBERSHIP_STATUS_ACTIVE\ntotal: 1\n"}
  };
  repeated GetMemberResponse members = 1;
  int32 total = 2;
}

message PurchaseMembershipBody {
  string plan_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  // Open provider vocabulary (MOMO, ZALOPAY, VNPAY, STRIPE, ...).
  string provider = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string discount_code = 3 [(buf.validate.field).string = {max_len: 64}];
  string idempotency_key = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message PurchaseMembershipRequest {
  string gym_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  PurchaseMembershipBody purchase = 2 [(buf.validate.field).required = true];
}

message PurchaseMembershipResponse {
  option (openapi.v3.schema) = {
    example: {yaml: "paymentUrl: https://payments.example.invalid/checkout/payment_example_01\npaymentId: payment_example_01\n"}
  };
  string payment_url = 1;
  string payment_id = 2;
}

message PauseMembershipRequest {
  string member_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string gym_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message ResumeMembershipRequest {
  string member_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string gym_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message GetMembershipStatusRequest {
  string member_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string gym_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message PauseMembershipResponse {
  option (openapi.v3.schema) = {
    example: {yaml: "memberId: member_example_01\nstatus: MEMBERSHIP_STATUS_PAUSED\nstartDate: 2026-01-01\nendDate: 2026-02-01\nremainingDays: 30\n"}
  };
  string member_id = 1;
  common.v1.MembershipStatus status = 2;
  string start_date = 3;
  string end_date = 4;
  int32 remaining_days = 5;
}

message ResumeMembershipResponse {
  option (openapi.v3.schema) = {
    example: {yaml: "memberId: member_example_01\nstatus: MEMBERSHIP_STATUS_ACTIVE\nstartDate: 2026-01-01\nendDate: 2026-02-01\nremainingDays: 30\n"}
  };
  string member_id = 1;
  common.v1.MembershipStatus status = 2;
  string start_date = 3;
  string end_date = 4;
  int32 remaining_days = 5;
}

message GetMembershipStatusResponse {
  option (openapi.v3.schema) = {
    example: {yaml: "memberId: member_example_01\nstatus: MEMBERSHIP_STATUS_ACTIVE\nstartDate: 2026-01-01\nendDate: 2026-02-01\nremainingDays: 30\n"}
  };
  string member_id = 1;
  common.v1.MembershipStatus status = 2;
  string start_date = 3;
  string end_date = 4;
  int32 remaining_days = 5;
}

message ValidateMembershipRequest {
  reserved 1;
  reserved "member_id";
  string gym_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string user_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message ValidateMembershipResponse {
  bool valid = 1;
  common.v1.MembershipStatus status = 2;
  string member_id = 3;
}

message ListMembersByStatusRequest {
  common.v1.MembershipStatus status = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  repeated string gym_ids = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    items: {
      string: {
        min_len: 1
        max_len: 128
      }
    }
  }];
}

message ListMembersByStatusResponse {
  repeated GetMemberResponse members = 1;
}
