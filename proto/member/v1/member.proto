syntax = "proto3";

package member.v1;

import "buf/validate/validate.proto";
import "common/v1/common.proto";

option go_package = "github.com/pploc/proto-go/member/v1;memberv1";
option java_multiple_files = true;
option java_package = "com.gym.proto.member.v1";

service MemberService {
  rpc GetMember(GetMemberRequest) returns (GetMemberResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);

  rpc PurchaseMembership(PurchaseMembershipRequest) returns (PurchaseMembershipResponse);
  rpc PauseMembership(PauseMembershipRequest) returns (PauseMembershipResponse);
  rpc ResumeMembership(ResumeMembershipRequest) returns (ResumeMembershipResponse);
  rpc GetMembershipStatus(GetMembershipStatusRequest) returns (GetMembershipStatusResponse);

  // Internal only. Requires the verified ms-gym-identifier workload identity.
  // This RPC is intentionally absent from the external HTTP configuration.
  rpc GetMembershipStatusByUserId(GetMembershipStatusByUserIdRequest) returns (GetMembershipStatusByUserIdResponse);

  // Internal only. Requires the verified ms-gym-checkin workload identity.
  // This RPC is intentionally absent from the external HTTP configuration.
  rpc ValidateMembership(ValidateMembershipRequest) returns (ValidateMembershipResponse);
  // Internal only. Requires the verified ms-gym-notification workload identity.
  // This RPC is intentionally absent from the external HTTP configuration.
  rpc ListMembersByStatus(ListMembersByStatusRequest) returns (ListMembersByStatusResponse);
}

message GetMemberRequest {
  string member_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message GetMemberResponse {
  string id = 1;
  string user_id = 2;
  reserved 3;
  reserved "gym_id";
  string full_name = 4;
  string phone = 5;
  string avatar_url = 6;
  string date_of_birth = 7;
  common.v1.MembershipStatus status = 8;
}

message UpdateProfileRequest {
  string member_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string full_name = 2 [(buf.validate.field).string = {max_len: 200}];
  string phone = 3 [(buf.validate.field).string = {max_len: 32}];
  string avatar_url = 4 [(buf.validate.field) = {
    ignore: IGNORE_IF_ZERO_VALUE
    string: {
      max_len: 2048
      uri: true
    }
  }];
  string date_of_birth = 5 [(buf.validate.field).string = {
    max_len: 32
    pattern: "^$|^\\d{4}-\\d{2}-\\d{2}$"
  }];
}

message UpdateProfileResponse {
  string id = 1;
  string user_id = 2;
  reserved 3;
  reserved "gym_id";
  string full_name = 4;
  string phone = 5;
  string avatar_url = 6;
  string date_of_birth = 7;
  common.v1.MembershipStatus status = 8;
}

message ListMembersRequest {
  int32 page = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100000
  }];
  int32 limit = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  string gym_id = 3 [(buf.validate.field).string = {max_len: 128}];
}

message ListMembersResponse {
  repeated GetMemberResponse members = 1;
  int32 total = 2;
}

message PurchaseMembershipRequest {
  string plan_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  // Open provider vocabulary (MOMO, ZALOPAY, VNPAY, STRIPE, ...).
  string provider = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string discount_code = 3 [(buf.validate.field).string = {max_len: 64}];
  string idempotency_key = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message PurchaseMembershipResponse {
  string payment_url = 1;
  string payment_id = 2;
}

message PauseMembershipRequest {
  string member_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message ResumeMembershipRequest {
  string member_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message GetMembershipStatusRequest {
  string member_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message GetMembershipStatusByUserIdRequest {
  string user_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string gym_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message PauseMembershipResponse {
  string member_id = 1;
  common.v1.MembershipStatus status = 2;
  string start_date = 3;
  string end_date = 4;
  int32 remaining_days = 5;
}

message ResumeMembershipResponse {
  string member_id = 1;
  common.v1.MembershipStatus status = 2;
  string start_date = 3;
  string end_date = 4;
  int32 remaining_days = 5;
}

message GetMembershipStatusResponse {
  string member_id = 1;
  common.v1.MembershipStatus status = 2;
  string start_date = 3;
  string end_date = 4;
  int32 remaining_days = 5;
}

message GetMembershipStatusByUserIdResponse {
  string member_id = 1;
  common.v1.MembershipStatus status = 2;
  string start_date = 3;
  string end_date = 4;
  int32 remaining_days = 5;
}

message ValidateMembershipRequest {
  string member_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string gym_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message ValidateMembershipResponse {
  bool valid = 1;
  common.v1.MembershipStatus status = 2;
}

message ListMembersByStatusRequest {
  common.v1.MembershipStatus status = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  repeated string gym_ids = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    items: {
      string: {
        min_len: 1
        max_len: 128
      }
    }
  }];
}

message ListMembersByStatusResponse {
  repeated GetMemberResponse members = 1;
}
