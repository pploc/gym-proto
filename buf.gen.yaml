version: v2
plugins:
  - remote: buf.build/protocolbuffers/go:v1.31.0
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.3.0
    out: gen/go
    opt: paths=source_relative
  - local:
      - go
      - run
      - github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@v2.18.1
    out: gen/go
    strategy: all
    opt:
      - paths=source_relative
      - grpc_api_configuration=proto/http.yaml
  - remote: buf.build/protocolbuffers/java:v25.1
    out: gen/java
  - remote: buf.build/grpc/java:v1.60.0
    out: gen/java
