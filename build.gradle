plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.gym.proto'
version = System.getenv('RELEASE_VERSION') ?: '8.0.0'

ext {
    confluentVersion = '8.0.7'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven {
        url 'https://packages.confluent.io/maven/'
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['gen/java']
        }
    }
    fixtures {
        java {
            srcDirs = ['src/fixtures/java']
        }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    fixturesImplementation.extendsFrom implementation
    fixturesRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    api 'io.grpc:grpc-protobuf:1.60.0'
    api 'io.grpc:grpc-stub:1.60.0'
    api 'com.google.protobuf:protobuf-java:4.33.5'
    implementation 'build.buf:protovalidate:0.6.0'
    api 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'

    // Confluent 7.x protobuf provider is GeneratedMessageV3-era and VerifyError's on protobuf 4.
    // Confluent 8.x needs com.google.protobuf.GeneratedFile (protobuf-java ≥ 4.33).
    fixturesImplementation("io.confluent:kafka-protobuf-serializer:${confluentVersion}") {
        exclude group: 'com.google.protobuf', module: 'protobuf-java'
        exclude group: 'com.google.protobuf', module: 'protobuf-java-util'
    }
    fixturesImplementation 'com.google.protobuf:protobuf-java:4.33.5'
    fixturesImplementation 'com.google.protobuf:protobuf-java-util:4.33.5'
}

configurations.fixturesRuntimeClasspath {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'com.google.protobuf') {
            details.useVersion '4.33.5'
            details.because 'Confluent 8 protobuf provider requires GeneratedFile (protobuf ≥ 4.33)'
        }
    }
}

tasks.register('verifyHttpConfig', Exec) {
    group = 'verification'
    description = 'Verify the consolidated HTTP configuration preserves all intentional mappings.'
    commandLine 'python3', layout.projectDirectory.file('scripts/verify-http-config.py').asFile.absolutePath
}

tasks.register('verifyRetiredSymbols', Exec) {
    group = 'verification'
    description = 'Verify retired Stage 0 RPC and message names are absent.'
    commandLine 'python3', layout.projectDirectory.file('scripts/verify-retired-symbols.py').asFile.absolutePath
}

tasks.register('generateOpenApi', Exec) {
    group = 'verification'
    description = 'Generate the active OpenAPI candidate from inline HTTP annotations.'
    commandLine 'bash', layout.projectDirectory.file('scripts/generate-openapi.sh').asFile.absolutePath
}

tasks.register('verifyOpenApi', Exec) {
    group = 'verification'
    description = 'Verify active OpenAPI matches canonical HTTP annotations.'
    dependsOn tasks.named('generateOpenApi')
    commandLine 'python3', layout.projectDirectory.file('scripts/verify-openapi.py').asFile.absolutePath
}

tasks.register('packageKongProto', Exec) {
    group = 'verification'
    description = 'Package deterministic source protobufs for Kong 3.8.'
    commandLine 'bash', layout.projectDirectory.file('scripts/package-kong-proto.sh').asFile.absolutePath
}

tasks.register('verifyKongProto', Exec) {
    group = 'verification'
    description = 'Verify Kong source protobuf bundle contents and startup mount smoke.'
    dependsOn tasks.named('packageKongProto')
    commandLine 'bash', '-c', "python3 '${layout.projectDirectory.file('scripts/verify-kong-proto.py').asFile.absolutePath}' && bash '${layout.projectDirectory.file('scripts/verify-kong-proto-smoke.sh').asFile.absolutePath}'"
}

tasks.register('verifyKongProtoTranscoding', Exec) {
    group = 'verification'
    description = 'Verify Kong 3.8 grpc-gateway parses mounted source protobufs on request.'
    dependsOn tasks.named('packageKongProto')
    commandLine 'bash', layout.projectDirectory.file('scripts/probe-kong-proto-transcoding.sh').asFile.absolutePath
}

tasks.register('probeKongProtoTranscoding', Exec) {
    group = 'verification'
    description = 'Record Kong 3.8 grpc-gateway source protobuf parser incompatibility.'
    dependsOn tasks.named('packageKongProto')
    commandLine 'bash', layout.projectDirectory.file('scripts/probe-kong-proto-transcoding.sh').asFile.absolutePath
}

tasks.named('verifyKongProtoTranscoding') {
    doLast {
        throw new GradleException('Kong 3.8 grpc-gateway cannot parse the current source protobuf bundle; use generated grpc-gateway fallback.')
    }
}


tasks.register('verifyKongErrorCandidate', Exec) {
    group = 'verification'
    description = 'Verify candidate remains blocked on measured Kong error behavior.'
    commandLine 'python3', layout.projectDirectory.file('scripts/verify-kong-errors.py').asFile.absolutePath
}

tasks.register('verifyKongErrorRelease', Exec) {
    group = 'verification'
    description = 'Refuse release while Kong error behavior is unmeasured.'
    commandLine 'python3', layout.projectDirectory.file('scripts/verify-kong-errors.py').asFile.absolutePath, '--release'
}

tasks.register('verifyGeneratedRoutes', Exec) {
    group = 'verification'
    description = 'Verify generated active-service routes match the frozen external surface.'
    dependsOn tasks.named('compileJava')
    commandLine 'bash', layout.projectDirectory.file('scripts/verify-generated-routes.sh').asFile.absolutePath
}

tasks.register('generateConfluentFixtures', JavaExec) {
    group = 'verification'
    description = 'Generate pinned Confluent Schema Registry byte fixtures from a clean Registry.'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(26)
    }
    classpath = sourceSets.fixtures.runtimeClasspath
    mainClass = 'com.gym.proto.fixtures.ConfluentFixtureGenerator'
    args(
            layout.projectDirectory.file('contracts/v1/kafka/confluent-7.7.1-fixtures.json').asFile.absolutePath,
            providers.gradleProperty('schemaRegistryUrl').orElse('http://localhost:8081').get()
    )
}

tasks.register('seedConfluentSchemas', JavaExec) {
    group = 'verification'
    description = 'Seed frozen Confluent schemas in a disposable Schema Registry.'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(26)
    }
    classpath = sourceSets.fixtures.runtimeClasspath
    mainClass = 'com.gym.proto.fixtures.ConfluentSchemaSeeder'
    args(providers.gradleProperty('schemaRegistryUrl').orElse('http://localhost:8081').get())
}

tasks.register('captureEmailVerificationToken', JavaExec) {
    group = 'verification'
    description = 'Capture one disposable email-verification token without logging its URL.'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(26)
    }
    classpath = sourceSets.fixtures.runtimeClasspath
    mainClass = 'com.gym.proto.fixtures.EmailVerificationTokenCapture'
    doFirst {
        if (!project.hasProperty('email') || !project.hasProperty('outputPath')) {
            throw new GradleException('email and outputPath are required')
        }
    }
    args(
            providers.gradleProperty('kafkaBrokers').orElse('localhost:9092').get(),
            providers.gradleProperty('schemaRegistryUrl').orElse('http://localhost:8081').get(),
            providers.gradleProperty('email').orElse('').get(),
            providers.gradleProperty('timeoutSeconds').orElse('60').get(),
            providers.gradleProperty('outputPath').orElse('').get()
    )
}

tasks.register('verifyEmailVerificationTokenCapture', JavaExec) {
    group = 'verification'
    description = 'Verify email-verification token extraction without Kafka.'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(26)
    }
    classpath = sourceSets.fixtures.runtimeClasspath
    mainClass = 'com.gym.proto.fixtures.EmailVerificationTokenCapture'
    jvmArgs '-ea'
    args '--self-check'
}

tasks.register('verifyConfluentFixtures', JavaExec) {
    group = 'verification'
    description = 'Verify committed Confluent Schema Registry byte fixtures without mutation.'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(26)
    }
    classpath = sourceSets.fixtures.runtimeClasspath
    mainClass = 'com.gym.proto.fixtures.ConfluentFixtureVerifier'
    args(layout.projectDirectory.file('contracts/v1/kafka/confluent-7.7.1-fixtures.json').asFile.absolutePath)
    if (project.hasProperty('schemaRegistryUrl')) {
        args(project.property('schemaRegistryUrl'))
    }
}

tasks.register('verifyConfluentBackwardCompatibility', JavaExec) {
    group = 'verification'
    description = 'Prove live Schema Registry BACKWARD compatibility positive and negative cases.'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(26)
    }
    classpath = sourceSets.fixtures.runtimeClasspath
    mainClass = 'com.gym.proto.fixtures.ConfluentCompatibilityVerifier'
    args(providers.gradleProperty('schemaRegistryUrl').orElse('http://localhost:8081').get())
}

tasks.withType(PublishToMavenRepository).configureEach {
    dependsOn tasks.named('verifyKongErrorRelease')
}

tasks.named('check') {
    dependsOn tasks.named('verifyHttpConfig')
    dependsOn tasks.named('verifyRetiredSymbols')
    dependsOn tasks.named('verifyOpenApi')
    dependsOn tasks.named('verifyKongProto')
    dependsOn tasks.named('verifyKongErrorCandidate')
    dependsOn tasks.named('verifyGeneratedRoutes')
    dependsOn tasks.named('verifyConfluentFixtures')
    dependsOn tasks.named('verifyEmailVerificationTokenCapture')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = project.group
            artifactId = 'gym-proto-java'
            version = project.version
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/pploc/gym-proto")
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}
